<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to JS Canvas Code Converter</title>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 800px; }
        textarea { width: 100%; height: 300px; font-family: monospace; margin-top: 10px; }
        .controls { margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Image to JS Canvas Drawing Converter</h2>
    
    <div class="controls">
        <label>1. Select an Image: </label>
        <input type="file" id="imageInput" accept="image/*"><br><br>
        
        <label>2. Max Resolution (Width in Pixels): </label>
        <input type="number" id="maxSize" value="100" style="width: 60px;">
        <small><i>(Keep this low, like 50-150, or the generated JS code will be massive!)</i></small>
    </div>

    <h3>Generated JavaScript Canvas Code:</h3>
    <textarea id="outputJs" readonly placeholder="Your generated JS code will appear here..."></textarea>

    <script>
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Setup a hidden canvas to read pixel data
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Resize image to keep the generated JS payload reasonable
                    const maxW = parseInt(document.getElementById('maxSize').value) || 100;
                    const scale = Math.min(maxW / img.width, 1);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    
                    // Draw image to extract data
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    
                    // Generate the JS drawing code string
                    let jsCode = `// Generated pure JS Canvas code\n`;
                    jsCode += `const canvas = document.createElement('canvas');\n`;
                    jsCode += `canvas.width = ${canvas.width};\n`;
                    jsCode += `canvas.height = ${canvas.height};\n`;
                    jsCode += `document.body.appendChild(canvas);\n`;
                    jsCode += `const ctx = canvas.getContext('2d');\n\n`;
                    
                    // Optimization: Batch drawing operations by color to reduce code size
                    const colorMap = {};
                    
                    for (let y = 0; y < canvas.height; y++) {
                        for (let x = 0; x < canvas.width; x++) {
                            const idx = (y * canvas.width + x) * 4;
                            const r = imgData[idx];
                            const g = imgData[idx + 1];
                            const b = imgData[idx + 2];
                            const a = (imgData[idx + 3] / 255).toFixed(2);
                            
                            if (a > 0) { // Skip fully transparent pixels
                                const colorStr = `rgba(${r},${g},${b},${a})`;
                                if (!colorMap[colorStr]) colorMap[colorStr] = [];
                                colorMap[colorStr].push({x, y});
                            }
                        }
                    }
                    
                    // Write out individual pixel rendering blocks
                    for (const [color, pixels] of Object.entries(colorMap)) {
                        jsCode += `ctx.fillStyle = "${color}";\n`;
                        pixels.forEach(p => {
                            jsCode += `ctx.fillRect(${p.x}, ${p.y}, 1, 1);\n`;
                        });
                    }
                    
                    document.getElementById('outputJs').value = jsCode;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
